<!-- Convey the browser that this is a HTML5 Document -->
<!DOCTYPE html>
<!-- html tag is called as Root Element of the HTML Document -->
<html>
    <!-- head is used to link external style sheets and to include the meta information about the web page and also title -->
    <head>
        <!-- Title is shown at the top of the tab in browser -->
        <title>This is a Web Page</title>
    </head>
    <body>
        <!-- All the content which can be seen in the browser will be written in body tag -->
        <h1>Hello World!</h1>
    </body>
</html>
