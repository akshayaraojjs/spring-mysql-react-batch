<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../media/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <style>
      form{
        width: 1800px;
      }
    </style>
  </head>
  <body>
    <h1 class="mx-auto">Registration Form</h1>
    <form class="container">
      <div class="mb-3">
        <label class="form-label" for="first_name">First Name:</label>
        <input class="form-control" type="text" name="first_name" id="first_name" required placeholder="Enter your name" maxlength="10">
      </div>
      
      <div class="mb-3">
        <label for="last_name">Last Name:</label>
        <input class="form-control" type="text" name="last_name" id="last_name">
      </div>
      
      <div class="mb-3">
        <label for="age">Age:</label>
        <input class="form-control" type="number" name="age" id="age" step="2" min="1" max="120">
      </div>
      
      <div class="mb-3">
        <label for="dob">DOB:</label>
        <input class="form-control" type="date" name="dob" id="dob" min="1906-01-01" max="2026-09-30">
      </div>

      <label for="birth_week">Birth Week:</label>
      <input class="form-control" type="week" name="birth_week" id="birth_week">

      <label for="birth_month">Birth Month:</label>
      <input class="form-control" type="month" name="birth_month" id="birth_month">

      <label for="birth_date_time">Birth Date & Time:</label>
      <input class="form-control" type="datetime-local" name="birth_date_time" id="birth_date_time">
      
      <label for="email_id">Email ID:</label>
      <input class="form-control" type="email" name="email_id" id="email_id" value="name@example.com">
      
      <label for="phone">Phone Number:</label>
      <input class="form-control" type="tel" name="phone" id="phone">
      
      <label for="password">Password:</label>
      <input class="form-control" type="password" name="password" id="password">
      
      <label for="address">Address:</label>
      <textarea class="form-control" name="address" id="address" rows="5" cols="30"></textarea>

      <div class="mb-3">
        <label class="form-label" for="gender">Gender:</label>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="gender" id="male" value="Male">
          <label class="form-check-label" for="male">Male</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="gender" id="female" value="Female" checked>
          <label class="form-check-label" for="female">Female</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="gender" id="others" value="Others">
          <label class="form-check-label" for="others">Others</label>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="course">Course:</label>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="course1" id="physics" value="Physics" checked>
          <label class="form-check-label" for="physics">Physics</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="course2" id="chemistry" value="Chemistry">
          <label class="form-check-label" for="chemistry">Chemistry</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="course3" id="maths" value="Mathematics">
          <label class="form-check-label" for="maths">Mathematics</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="course4" id="computer_science" value="Computer Science">
          <label class="form-check-label" for="computer_science">Computer Science</label>
        </div>
      </div>
      
      <label for="state">State:</label>
      <select class="form-select" name="state" id="state">
        <option>Select your state</option>
        <option value="Karnataka" selected>Karnataka</option>
        <option value="Tamil Nadu">Tamil Nadu</option>
        <option value="Kerala">Kerala</option>
        <option value="Goa">Goa</option>
        <option value="Maharashtra">Maharashtra</option>
        <option value="Telangana">Telangana</option>
      </select>

      <div class="mb-3">
        <label for="photo">Upload Photo:</label>
        <input class="form-control" type="file" name="photo" id="photo" multiple accept="image/*">
      </div>
      
      <div class="mb-3">
        <label for="rating">Rating:</label>
        <input class="form-range" type="range" name="rating" id="rating" min="1" max="10" value="7">
      </div>

      <div class="mb-3">
        <label for="fav_color">Favourite Color:</label>
        <input class="form-control" type="color" name="fav_color" id="fav_color">
      </div>

      <!-- To apply button styles, btn is mandatory -->
      <input class="btn btn-outline-danger" type="reset" value="Clear Form">
      <input class="btn btn-outline-success" type="submit" value="Submit Form">
    </form>
    <script src="../media/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
